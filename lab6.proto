syntax = "proto3";

package lab6;

message addMsg {
    int32 a = 1;
    int32 b = 2;
}

message addReply {
    int32 sum = 1;
}

message rawImageMsg {
    bytes img = 1;
}

message jsonImageMsg {
    string img = 1;
}

message imageReply {
    int32 width = 1;
    int32 height = 2;
}

message dotProductMsg {
    repeated float a = 1;
    repeated float b = 2;
}

message dotProductReply {
    float dotproduct = 1;
}

service Lab6 {
    rpc Add (addMsg) returns (addReply) {}
    rpc RawImage (rawImageMsg) returns (imageReply) {}
    rpc DotProduct (dotProductMsg) returns (dotProductReply) {}
    rpc JsonImage (jsonImageMsg) returns (imageReply) {}
}